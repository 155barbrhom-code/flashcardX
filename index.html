<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f5bd5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>بطاقاتي الدراسية – السادس الإعدادي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--sf:#fff;--tx:#1d2330;--mut:#6a7384;--bd:#e4e0d6;--weak:#e5484d;--mid:#e89b0c;--str:#2ba26b;--acc:#4f5bd5;--sh:0 2px 12px rgba(30,35,50,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151b;--sf:#1d2029;--tx:#eceff5;--mut:#9ba4b5;--bd:#2c313d;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13151b;--sf:#1d2029;--tx:#eceff5;--mut:#9ba4b5;--bd:#2c313d;--sh:none;color-scheme:dark}
:root[data-theme="night"]{--bg:#17130f;--sf:#221c16;--tx:#eadfca;--mut:#a89b85;--bd:#372e24;--sh:none;color-scheme:dark}
:root[data-theme="paper"]{--bg:#f1e8d3;--sf:#faf4e4;--tx:#3a3226;--mut:#7d7160;--bd:#ddd0b3;--sh:0 2px 10px rgba(90,70,30,.1);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:calc(16px*var(--fs,1))}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.6 var(--ff,'Cairo'),'Cairo','Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
.w{max-width:880px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 10px}
h1{font-size:1.2rem;margin:0}h2{margin:10px 0}
#sy{font-size:.74rem;color:var(--mut)}
button{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn.big{width:100%;padding:13px;font-size:1.05rem;margin:10px 0}
.g{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:7px 14px;cursor:pointer}
.lk{background:none;border:0;color:var(--acc);cursor:pointer;padding:0;font-weight:600}
.cr{color:var(--mut);font-size:.9rem;margin-top:4px}
input,textarea,select{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font:inherit}
textarea{resize:vertical}
.add{display:flex;gap:8px;margin:16px 0}.add input{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--sf);border:1px solid var(--bd);border-top:5px solid hsl(var(--h) 65% 52%);border-radius:16px;padding:16px 16px 8px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tt{font-weight:700;font-size:1.05rem}
.ts{color:var(--mut);font-size:.82rem;margin:2px 0 10px}
.ta{display:flex;gap:2px;justify-content:flex-end;margin-top:6px}
.bar{height:7px;border-radius:9px;background:var(--bd);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.ic{background:none;border:0;cursor:pointer;font-size:.95rem;opacity:.7;padding:2px 7px;border-radius:8px}
.ic:hover{opacity:1}
.ic.arm{opacity:1;color:#fff;background:var(--weak)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{--c:var(--bd);border:1px solid var(--c);background:transparent;border-radius:99px;padding:3px 12px;font-size:.85rem;cursor:pointer;opacity:.5}
.chip.on{opacity:1;background:color-mix(in srgb,var(--c) 20%,transparent)}
.chip.p{--c:var(--mut);opacity:1;border-style:dashed;color:var(--mut)}
.chip.p.on{color:var(--tx);border-style:solid}
.pf{border:1px solid var(--bd);background:var(--sf);border-radius:99px;padding:3px 14px;cursor:pointer}
.pf.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--tx)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--bd);background:transparent;border-radius:10px;padding:6px;cursor:pointer;font-size:.9rem}
.tabs .on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pn{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0;display:grid;gap:8px}
.pn small{color:var(--mut)}
.bkc{font-size:.85rem;color:var(--mut)}.bkc em{color:var(--weak);font-style:normal;display:block}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.qa{flex:1;min-width:200px}.qa b{display:block}.qa span{color:var(--mut);font-size:.9rem;white-space:pre-wrap}
.rt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{border:1px solid var(--c);background:transparent;border-radius:99px;padding:1px 10px;font-size:.78rem;cursor:pointer}
.dot.on{background:var(--c);color:#fff}
.em{text-align:center;color:var(--mut);padding:28px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fc{perspective:1200px;height:min(55vh,360px);margin:16px 0;cursor:pointer}
.fi{position:relative;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fc.fl .fi{transform:rotateY(180deg)}
.fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;overflow:auto}
.fa p{font-size:1.3rem;font-weight:600;margin:8px 0;white-space:pre-wrap}
.fa small{color:var(--acc);font-weight:700}.fa em{color:var(--mut);font-size:.78rem;font-style:normal}
.fb{transform:rotateY(180deg);border-color:var(--acc)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:0;border-radius:14px;padding:14px;color:#fff;font-weight:700;cursor:pointer;background:var(--c)}
.nav{display:flex;justify-content:space-between;margin-top:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;text-align:center}
.sum div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;font-size:1.6rem;font-weight:700}
.sum small{display:block;font-size:.8rem;color:var(--mut);font-weight:400}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:8px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
#toast.on{opacity:1}
.no{background:var(--bd);border:0;border-radius:8px;padding:0 8px;font-weight:700;cursor:pointer;min-width:44px}
.mp{width:72px;padding:4px 8px}.pg{justify-content:center;margin:10px 0}
</style>
</head>
<body>
<div class="w">
<header><h1>🗂️ بطاقاتي – السادس الإعدادي</h1><div><span id="sy"></span> <button class="g" data-a="set" title="الإعدادات">⚙️</button></div></header>
<div id="set" class="pn" hidden>
<b>المظهر</b><div class="rt"><button class="pf" data-a="pref" data-k="mode" data-v="auto">تلقائي</button><button class="pf" data-a="pref" data-k="mode" data-v="light">فاتح</button><button class="pf" data-a="pref" data-k="mode" data-v="dark">داكن</button><button class="pf" data-a="pref" data-k="mode" data-v="night">ليلي مريح</button><button class="pf" data-a="pref" data-k="mode" data-v="paper">ورقي</button></div>
<b>اللون الأساسي</b><div class="rt" id="sws"></div>
<b>حجم الخط</b><div class="rt"><button class="pf" data-a="pref" data-k="fs" data-v="0.9">صغير</button><button class="pf" data-a="pref" data-k="fs" data-v="1">عادي</button><button class="pf" data-a="pref" data-k="fs" data-v="1.15">كبير</button><button class="pf" data-a="pref" data-k="fs" data-v="1.3">كبير جداً</button></div>
<b>الخط</b><div class="rt" id="fts"></div>
<b>النسخ الاحتياطي</b><small id="bst"></small>
<div class="rt"><button class="g" data-a="export">💾 تنزيل نسخة احتياطية</button><label class="g">📂 استعادة من ملف<input type="file" id="rf" accept=".json,application/json" hidden></label></div><div id="rinfo" class="bkc"></div>
</div>
<main id="app"></main>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let UC=0;const uid=()=>Date.now().toString(36)+(UC++).toString(36)+Math.random().toString(36).slice(2,5);
const KEY='sadis_cards_v1';
const LV=[['جديد','#8b93a1'],['ضعيف','var(--weak)'],['متوسط','var(--mid)'],['قوي','var(--str)']];
const ACC=['#4f5bd5','#0f9d8a','#d6457a','#e0731f','#2f9e5b','#8a4fd5'];
const PROMPT=['استخرج من الصفحات المرفقة جميع الأسئلة وأجوبتها، وأخرجها بالشروط التالية حرفياً:',
'1) كل بطاقة في سطر واحد فقط بهذه الصيغة: رقم) السؤال :: الجواب',
'2) الترقيم إلزامي: رقّم البطاقات ترقيماً متسلسلاً يبدأ من 1 حسب ترتيب ظهورها في الصفحات، بلا تخطٍّ ولا تكرار ولا إعادة بدء من 1 في منتصف القائمة. الرقم يتبعه قوس إغلاق، هكذا: 12)',
'3) الفاصل بين السؤال والجواب هو :: (نقطتان مرتين)، ولا تستخدمه في أي مكان آخر داخل النص.',
'4) لا تنزل لسطر جديد داخل الجواب أبداً. إذا كان الجواب عدة نقاط فاكتبها في السطر نفسه هكذا: (1) ... (2) ... (3) ...',
'5) لا أسطر فارغة بين البطاقات، ولا نقاط أو شرطات في بداية السطر (الترقيم فقط).',
'6) لا مقدمة ولا شرح ولا عناوين ولا ملاحظات داخل البطاقات: البطاقات فقط.',
'7) ضع كل البطاقات داخل كتلة كود واحدة (Code block) لأتمكن من نسخها بزر النسخ. وبعد الكتلة اكتب جملة واحدة فقط: عدد البطاقات = (الرقم).',
'8) لا تحذف أي سؤال ولا تدمج سؤالين. وإذا تكرر السؤال في أكثر من صفحة فاكتبه مرة واحدة.',
'9) أسئلة علل: ابدأ السؤال بكلمة علل. والأسئلة الوزارية: أضف بين قوسين في نهاية السؤال السنة والدور مثل (وزاري 2019 د3)، وعدد التكرار إن وُجد مثل (مكرر 11 مرة).',
'10) اكتب النص العربي كما في الصفحات دون تشكيل. لا تضف معلومات من خارج الصفحات ولا تخترع أجوبة؛ وإن لم يتضح جواب فاكتب [غير واضح].',
'11) تجاهل الإعلانات وأسماء المواقع والحواشي وأي ملاحظات مكتوبة بخط اليد.',
'مثال على الشكل المطلوب:',
'1) ما النسيج؟ (وزاري 2016 د3) :: مجموعة من الخلايا المتماثلة مع نواتجها الخلوية، تخصصت لأداء وظيفة معينة',
'2) علل: لا يحدث تحول كامل النسيج المرستيمي إلى نسيج دائمي؟ :: لغرض بقاء جزء من هذا النسيج دائم التجدد لتكوين خلايا جديدة'].join('\n');
function seed(){return{ts:0,subjects:[['الأحياء','🧬',140],['الكيمياء','⚗️',270],['الفيزياء','⚛️',210],['اللغة العربية','📖',350],['اللغة الإنكليزية','🔤',190],['التربية الإسلامية','🕌',100]].map(([name,emoji,h])=>({id:uid(),name,emoji,h,chapters:[]}))}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.subjects)return d}catch(e){}return seed()}
const fix=d=>{d.prefs=Object.assign({mode:'auto',acc:ACC[0],fs:1,font:'Cairo'},d.prefs||{});d.subjects=d.subjects.filter(x=>!(x.name==='الرياضيات'&&!x.chapters.length));return d};
let D=fix(load()),V={t:'home'},F=new Set([0,1,2,3]),ST=null,E=null,R=null,M='one',SKIP=true,TPL=false,armed=null,col=null,lastC=[],lastN=0,tm,PG=0,PS=40,MV=null,MG=true,CX=new Map(),ub=0,BK='',PEND=null,PREV=null;
const S=()=>D.subjects.find(x=>x.id===V.s),C=()=>S().chapters.find(x=>x.id===V.c),L=()=>C().lectures.find(x=>x.id===V.l);
const list=k=>k==='s'?D.subjects:k==='c'?S().chapters:C().lectures;
const allC=(n,t)=>t==='s'?n.chapters.flatMap(c=>c.lectures.flatMap(l=>l.cards)):t==='c'?n.lectures.flatMap(l=>l.cards):n.cards;
const dg=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const shuffle=q=>{for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}};
const mvCard=(l,i,j)=>{const[c]=l.cards.splice(i,1);l.cards.splice(j,0,c)};
const mkCtx=()=>{CX=new Map();D.subjects.forEach(s=>s.chapters.forEach(c=>c.lectures.forEach(l=>l.cards.forEach((k,i)=>CX.set(k,{n:i+1,l:l.name})))))};
const chunk=j=>{const o=[];let i=0;while(i<j.length){let e=Math.min(i+60000,j.length);if(e<j.length){const c=j.charCodeAt(e);if(c>=0xDC00&&c<=0xDFFF)e--}o.push(j.slice(i,e));i=e}return o.length?o:['']};
const idb={db:null,open(){return new Promise((res,rej)=>{const r=indexedDB.open('sadis',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
async get(){this.db=this.db||await this.open();return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get('D');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
async set(v){this.db=this.db||await this.open();return new Promise((res,rej)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,'D');t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}};
const cnt=d=>d.subjects.reduce((n,x)=>n+allC(x,'s').length,0);
function bst(){const e=$('#bst');if(e)e.textContent=(D.lastBackup?'آخر نسخة: '+new Date(D.lastBackup).toLocaleDateString('ar-IQ'):'لم تحفظ نسخة احتياطية بعد')+' · '+cnt(D).toLocaleString('en')+' بطاقة'}
async function exportData(){try{const name='flashcards-'+new Date().toISOString().slice(0,10)+'.json',data=JSON.stringify({app:'sadis-cards',v:1,exported:Date.now(),data:D});let dl=null;try{dl=await window.claude?.use?.('downloads')}catch(e){}
if(dl)await dl.save({filename:name,data});else{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
D.lastBackup=Date.now();save();bst();if(V.t==='home')render();toast('تم حفظ النسخة الاحتياطية ✅')}catch(e){toast(e&&e.code==='declined'?'أُلغي الحفظ':'تعذّر الحفظ')}}
const norm=d=>{if(d&&d.data&&d.data.subjects)d=d.data;if(!d||!Array.isArray(d.subjects))return null;const A=x=>Array.isArray(x)?x:[],T=v=>String(v==null?'':v);
return{prefs:d.prefs,lastBackup:d.lastBackup,subjects:A(d.subjects).filter(x=>x&&x.name).map(x=>({id:uid(),name:T(x.name),emoji:T(x.emoji||'📘'),h:+x.h||0,chapters:A(x.chapters).map(c=>({id:uid(),name:T(c.name),lectures:A(c.lectures).map(l=>({id:uid(),name:T(l.name),cards:A(l.cards).filter(k=>k&&k.q&&k.a).map(k=>({id:uid(),q:T(k.q),a:T(k.a),lv:[0,1,2,3].includes(k.lv)?k.lv:0}))}))}))}))}};
const doneImp=()=>{$('#rinfo').innerHTML='✅ تمت الاستعادة. <button class="g" data-a="undoimp">↩️ تراجع</button>';bst()};
function applyPrefs(){const p=D.prefs,r=document.documentElement;p.mode==='auto'?delete r.dataset.theme:r.dataset.theme=p.mode;r.style.setProperty('--acc',p.acc);r.style.setProperty('--fs',p.fs);r.style.setProperty('--ff',"'"+p.font+"'");loadFont(p.font);
document.querySelectorAll('[data-a=pref]').forEach(b=>b.classList.toggle('on',String(p[b.dataset.k])===b.dataset.v))}
const FONTS=[['Cairo','كايرو'],['Tajawal','تجوال'],['Almarai','المراعي'],['IBM Plex Sans Arabic','بلكس'],['Noto Naskh Arabic','نسخ'],['Amiri','أميري']],LF=new Set(['Cairo']);
function loadFont(n){if(LF.has(n))return;LF.add(n);const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+n.replace(/ /g,'+')+':wght@400;700&display=swap';document.head.appendChild(l)}
$('#fts').innerHTML=FONTS.map(([v,t])=>`<button class="pf" data-a="pref" data-k="font" data-v="${v}">${t}</button>`).join('');
$('#sws').innerHTML=ACC.map(c=>`<button class="sw" style="background:${c}" data-a="pref" data-k="acc" data-v="${c}" title="${c}"></button>`).join('');
function setSync(m){const e=$('#sy');if(e)e.textContent=m==='cloud'?'☁️ محفوظ في حسابك':m==='big'?'💾 كبيرة جداً للسحابة: على هذا الجهاز':m==='err'?'⚠️ تعذّرت المزامنة':'💾 محفوظ على هذا الجهاز'}
let pt=0;
function persist(){pt=0;idb.set(D).catch(()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('⚠️ مساحة التخزين ممتلئة')}})}
function flush(){if(pt){clearTimeout(pt);persist()}}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
function save(){D.ts=Date.now();clearTimeout(pt);pt=setTimeout(persist,600);push()}
function push(){if(!col)return;clearTimeout(tm);tm=setTimeout(async()=>{try{const j=JSON.stringify(D);if(j.length>1500000){setSync('big');return}const ps=chunk(j),n=ps.length;
for(let i=0;i<n;i++)if(lastC[i]!==ps[i]){await col.doc('c'+i).set({j:ps[i]});lastC[i]=ps[i]}
await col.doc('store').set({n,ts:D.ts});for(let i=n;i<lastN;i++){try{await col.doc('c'+i).delete()}catch(e){}}lastC.length=n;lastN=n;setSync('cloud')}catch(e){setSync('err')}},2000)}
const to=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(r,ms))]);
async function cloud(){try{const c=window.claude;if(!c||!c.use)return;const[db,us]=await to(Promise.all([c.use('db'),c.use('user')]),10000);if(!db||!us)return;const id=await us.id();col=db.collection('data/users/'+id);
const m=await to(col.doc('store').get(),10000);let r=null;
if(m.exists){const md=m.data();if(md.json)r=JSON.parse(md.json);else if(md.n){const ps=await to(Promise.all(Array.from({length:md.n},(_,i)=>col.doc('c'+i).get())),30000);lastC=ps.map(x=>x.data().j);lastN=md.n;r=JSON.parse(lastC.join(''))}}

function bkParse(t,l){const ok=[],bad=[],gaps=[],seen=new Set(l.cards.map(c=>c.q.trim()));let dup=0,mg=0,prev=null,fn=null,nn=0,last=null;

const i=s.indexOf('::');let q,a;if(i>=0){q=s.slice(0,i).trim();a=s.slice(i+2).trim()}else if(s.includes('\t')){const p=s.split('\t');q=p[0].trim();a=p.slice(1).join(' ').trim()}

return{ok,bad,dup,mg,gaps,nn,fn,lastNo:prev}}

else if('123'.includes(ev.key)&&ST.i<ST.q.length)document.querySelector(`[data-a="rate"][data-i="${ev.key}"]`)?.click()});
